name: VeltrixDB Outreach — Weekly Lead Digest

on:
  schedule:
    # Every Monday at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * 1'
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write  # needed to commit seen.json back to the repo

jobs:
  outreach:
    name: Fetch leads & intent signals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        run: go build -o veltrix-outreach .

      - name: Post weekly digest
        env:
          # Required: Slack webhook for the outreach channel
          SLACK_OUTREACH_WEBHOOK: ${{ secrets.SLACK_OUTREACH_WEBHOOK }}

          # Auto-provided by GitHub Actions (raises API limit to 5000 req/hr)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional: Bing Web Search API key for LinkedIn intent signals.
          # Free tier: 1000 queries/month via Azure Free account.
          # Get key: portal.azure.com → Create resource → Bing Search v7
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
        run: ./veltrix-outreach

      - name: Commit updated seen.json
        run: |
          git config user.name  "veltrix-outreach[bot]"
          git config user.email "bot@veltrixdb.io"
          git add seen.json
          git diff --cached --quiet && echo "seen.json unchanged" || \
            git commit -m "chore: update seen leads [skip ci]"
          git push
